[project]
name = "query-pipeline"
version = "0.1.0"
description = "Config-driven question cleaning, dedup, and classification pipeline"
authors = [{ name = "cmy", email = "cmyhhxx@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "openai>=2.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.scripts]
query-pipeline = "query_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_pipeline"]

[tool.hatch.build]
sources = ["src"]
