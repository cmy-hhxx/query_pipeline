[project]
name = "query-pipeline"
version = "0.1.0"
description = "Config-driven question cleaning, dedup, and classification pipeline"
authors = [{ name = "cmy", email = "cmyhhxx@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "openai>=2.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.scripts]
query-pipeline = "query_pipeline.cli:main"
query-pipeline-qc = "query_pipeline.quality.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 不设 sources（默认项目根），packages 按 src 布局写全路径：
# hatch 打包时自动剥离 src/ 前缀（wheel 内为 query_pipeline/），
# editable 安装时 finder 正确映射 src/query_pipeline。
packages = ["src/query_pipeline"]
# templates/ 是包内数据（src/query_pipeline/templates/），随 wheel 自动发布。


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
