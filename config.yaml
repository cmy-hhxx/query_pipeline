name: session_pipeline

input:
  path: data/aime/input.jsonl

output:
  dir: outputs
  complex_queries: complex_queries.jsonl
  summary: summary.json

work_dir: work

session_stage:
  enabled: true
  segmentation:
    enabled: true
  step1:
    enabled: true
    reject_rules: true
    min_chain_tool_calls: 7
    min_chain_steps: 1
    min_unique_tools: 2
  step2:
    enabled: true
    prompt_id: complex_judge

llm_stage:
  enabled: true
  base_url_env: OPENAI_BASE_URL
  model: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY
  concurrency: 64
  max_retries: 5
  timeout_seconds: 90
  response_format: json_object
  cache: work/llm_cache.jsonl
