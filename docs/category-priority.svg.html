<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mono — 9 类判定优先级</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1C1A;--paper:#F0EFEB;--muted:#8F8E88;--grid:#DEDDD6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding:30px 16px}
.wrap{max-width:1080px;margin:0 auto}
.card{background:#fff;border-radius:24px;padding:32px 36px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.card.dark{background:var(--ink);color:var(--paper)}
h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 22px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.sub b{color:var(--ink);font-weight:700}
svg{display:block;width:100%;height:auto;margin:8px 0 4px}
.src{margin-top:14px;font-size:10.5px;letter-spacing:.18em;font-weight:700;color:var(--muted);text-transform:uppercase}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade{animation:fadeIn .6s cubic-bezier(.22,.61,.36,1) both}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>9 类的判定难度并不均匀</h2>
    <div class="sub">一格 = 一条边界规则 · 数字 = 该类在判定时需要主动排除的相邻类别数 · 按判定顺序 01→09 排列</div>
    <svg id="chart" viewBox="0 0 960 360" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="src">TICK ROWS · MONO-BASIC · CATEGORY TAXONOMY · FIN_BENCH COMPLEX-TOPIC</div>
  </div>
</div>
<script>
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;

// 9 类 + 边界规则数(从 fin_bench tag_cards.json 的 boundary_rules/exclude_when 实际条目数)
// 数字含义:判定时必须主动排除的相邻类别数,反映边界复杂度
const D=[
  ['01 数据与指标计算', 4],
  ['02 预测与推演', 4],
  ['03 分析研究', 4],
  ['04 机会挖掘', 6],
  ['05 资产配置', 4],
  ['06 投资决策', 5],
  ['07 策略触发与设置', 5],
  ['08 目标执行', 4],
  ['09 动作输出', 5],
];

(()=>{
  const s=document.getElementById('chart');
  // 9 行,每行高 32px,顶距 30,底距 30
  const y0=i=>30+i*32, X0=180, PX=64, HW=22, max=Math.max(...D.map(d=>d[1]));

  // 顶部基线(横跨整张)
  el(s,'line',{x1:30,y1:14,x2:930,y2:14,stroke:GRID,'stroke-width':.5});

  D.forEach(([name,v],i)=>{
    const y=y0(i);
    // 左侧类别名(英文slug+中文名同行)
    const [id, ...rest]=name.split(' ');
    const label=`${id} ${rest.join(' ')}`;
    txt(s,{x:24,y:y+5,'font-size':13,'font-weight':800,fill:INK,
      'letter-spacing':'.04em'},id);
    txt(s,{x:64,y:y+5,'font-size':11,'font-weight':600,fill:MUTED,
      'letter-spacing':'.02em'},rest.join(' '));

    // 横轴基线
    el(s,'line',{x1:X0,y1:y+12,x2:X0+max*PX,y2:y+12,stroke:GRID,'stroke-width':.5,
      class:'fade',style:`animation-delay:${i*.08}s`});

    // 每条规则一格
    for(let k=0;k<v;k++){
      const x=X0+k*PX+PX/2;
      const h=14+rnd(k+1,i+2)*8;
      el(s,'line',{x1:x,y1:y+12,x2:x,y2:y+12-h,stroke:INK,'stroke-width':1.4,
        opacity:.55+rnd(k+3,i+5)*.45,class:'fade',style:`animation-delay:${i*.08+k*.012}s`});
      if(k===0||(k+1)%2===0)el(s,'circle',{cx:x,cy:y+16,r:1.4,fill:INK,
        class:'fade',style:`animation-delay:${i*.08+k*.012}s`});
    }

    // 行尾大数
    const lab=txt(s,{x:X0+v*PX+14,y:y+5,'font-size':14,'font-weight':800,fill:INK,
      class:'fade',style:`animation-delay:${.4+i*.08}s`},v);
    tip(lab,`${label} — ${v} 条边界规则`);
  });

  // 底部副注
  txt(s,{x:480,y:345,'font-size':10,'font-weight':700,fill:MUTED,'text-anchor':'middle',
    'letter-spacing':'.18em'},
    'EACH TICK = ONE BOUNDARY RULE TO EXCLUDE · DOTS = INDEXED RULE');
})();
</script>
</body>
</html>
