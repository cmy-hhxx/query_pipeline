name: iwencai_pipeline

input:
  path: data/iwencai/cn_expert_daily_2026-08-05.jsonl
  format: session

output:
  dir: outputs/iwencai
  complex_queries: complex_queries_cn_expert_0805.jsonl
  summary: summary_cn_expert_0805.json

work_dir: work/iwencai/cn_expert_0805

segmentation:
  enabled: false

# 严格初筛:reject 规则 + 至少 4 个不同工具 / 至少 4 次工具调用（候选 ~3788，网格搜索结果）
step1:
  enabled: true
  reject_rules: true
  min_chain_tool_calls: 4
  min_chain_steps: 1
  min_unique_tools: 4

step2:
  enabled: true
  prompt_id: complex_judge

verify:
  enabled: true
  prompt_id: verify_complex
  max_rounds: 3

post:
  enabled: true
  dedup:
    enabled: true
    threshold: 0.80
    entity_slot: true
  translate:
    enabled: true

llm:
  enabled: true
  base_url_env: OPENAI_BASE_URL
  model: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY
  concurrency: 128
  max_retries: 5
  timeout_seconds: 90
  response_format: json_object
  cache: work/iwencai/cn_expert_0805/llm_cache.jsonl

checkpoint:
  enabled: true
  dir: work/iwencai/cn_expert_0805/checkpoints

debug:
  dump_intermediates: true
