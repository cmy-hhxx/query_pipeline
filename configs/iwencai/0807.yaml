# iwencai/0807.jsonl 清洗标注配置（格式：chat）
name: iwencai_0807

input:
  path: data/iwencai/0807.jsonl
  format: chat

output:
  dir: outputs/iwencai
  cleaned_queries: cleaned_queries_0807.jsonl
  complex_queries: complex_queries_0807.jsonl
  normal_queries: normal_queries_0807.jsonl
  summary: summary_0807.json

segmentation:
  enabled: false

rule_gate:
  enabled: true
  reject_rules: true
  min_chain_tool_calls: 3
  min_chain_steps: 1
  min_unique_tools: 2

judge:
  enabled: true
  value_prompt: value_gate
  complexity_prompt: complexity_gate
  classify_complex_prompt: classify_complex
  classify_normal_prompt: classify_normal

verify:
  enabled: true
  prompt_id: verify_complex
  max_rounds_hard: 5
  max_rounds_normal: 2

post:
  enabled: true
  dedup:
    enabled: true
    threshold: 0.80
    entity_slot: true
  translate:
    enabled: true

llm:
  enabled: true
  base_url_env: OPENAI_BASE_URL
  model: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY
  concurrency: 128
  max_retries: 5
  timeout_seconds: 90
  response_format: json_object

checkpoint:
  enabled: true

debug:
  dump_intermediates: true
