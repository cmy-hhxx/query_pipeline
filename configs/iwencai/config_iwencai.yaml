name: iwencai_pipeline

input:
  path: data/iwencai/judge_data_9662_copy.jsonl
  format: judge_data  # session (full thread per line) | judge_data (single-case lines with a judge_data wrapper)

output:
  dir: outputs_iwencai
  complex_queries: complex_queries_iwencai.jsonl
  summary: summary_iwencai.json

work_dir: work_iwencai

session_stage:
  enabled: true
  segmentation:
    enabled: true
  step1:
    enabled: true
    reject_rules: true
    min_chain_tool_calls: 7
    min_chain_steps: 1
    min_unique_tools: 2
  step2:
    enabled: true
    prompt_id: complex_judge

verify_stage:
  enabled: true
  prompt_id: verify_complex

post_stage:
  enabled: true
  dedup:
    enabled: true
    threshold: 0.85
  translate:
    enabled: true
    target: zh

llm_stage:
  enabled: true
  base_url_env: OPENAI_BASE_URL
  model: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY
  concurrency: 64
  max_retries: 5
  timeout_seconds: 90
  response_format: json_object
  cache: work_iwencai/llm_cache.jsonl

checkpoint:
  enabled: true
  dir: work_iwencai/checkpoints
