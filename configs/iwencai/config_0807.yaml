name: iwencai_pipeline

input:
  path: data/iwencai/0807.jsonl
  format: chat

output:
  dir: outputs/iwencai
  complex_queries: complex_queries_0807.jsonl
  summary: summary_0807.json

work_dir: work/iwencai/0807

segmentation:
  enabled: false

step1:
  enabled: false
  reject_rules: true
  min_chain_tool_calls: 7
  min_chain_steps: 1
  min_unique_tools: 2

step2:
  enabled: true
  prompt_id: complex_judge

verify:
  enabled: true
  prompt_id: verify_complex
  max_rounds: 3

post:
  enabled: true
  dedup:
    enabled: true
    threshold: 0.85
  translate:
    enabled: true

llm:
  enabled: true
  base_url_env: OPENAI_BASE_URL
  model: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY
  concurrency: 64
  max_retries: 5
  timeout_seconds: 90
  response_format: json_object
  cache: work/iwencai/0807/llm_cache.jsonl

checkpoint:
  enabled: true
  dir: work/iwencai/0807/checkpoints

debug:
  dump_intermediates: true
